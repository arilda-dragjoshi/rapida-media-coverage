const LANGS = { en: "English", es: "Spanish", fr: "French", pt: "Portuguese", ar: "Arabic" };
const lang = c => LANGS[c] || (c ? c.toUpperCase() : "Not detected");
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
const fmt = d => { if (!d) return ""; const x = new Date(d + "T00:00:00Z"); return isNaN(x) ? d : x.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }); };
const keyOf = (r, g) => g === "year" ? (r.date || "").slice(0, 4) || "Undated" : g === "language" ? lang(r.language) : (r[g] || "Not stated");
const tally = (f) => { const m = new Map(); REFS.forEach(r => { const k = f(r); if (k) m.set(k, (m.get(k) || 0) + 1); }); return [...m].sort((a, b) => b[1] - a[1]); };

const countries = tally(r => r.country), outlets = tally(r => r.outlet), crises = tally(r => r.crisis_type), langs = tally(r => r.language);
const yrs = REFS.map(r => (r.date || "").slice(0, 4)).filter(Boolean).sort();
const social = REFS.filter(r => /Facebook|LinkedIn|X \(|Bluesky|Mastodon|Reddit|Instagram/.test(r.platform)).length;
document.getElementById("lede").innerHTML =
  `UNDP's RAPIDA assessments were referenced <b>${REFS.length} times</b> by <b>${outlets.length} outlets</b> in <b>${countries.length} countries</b>` +
  (yrs.length ? `, from ${yrs[0]} to ${yrs[yrs.length - 1]}` : "") + `, in ${langs.filter(l => l[0]).map(l => lang(l[0])).join(" and ")}. ${social} are social media posts.`;
const block = (t, rows) => `<div><h2>${t}</h2><ul>${rows.slice(0, 6).map(([k, n]) => `<li><span>${esc(k)}</span><span>${n}</span></li>`).join("")}</ul></div>`;
document.getElementById("tops").innerHTML = block("Countries", countries) + block("Outlets", outlets) + block("Crises", crises);

const fc = document.getElementById("fc"), fl = document.getElementById("fl"), fg = document.getElementById("fg"), q = document.getElementById("q");
fc.innerHTML = `<option value="">All countries</option>` + countries.map(([k]) => `<option>${esc(k)}</option>`).join("");
fl.innerHTML = `<option value="">All languages</option>` + langs.map(([k]) => `<option value="${esc(k)}">${esc(lang(k))}</option>`).join("");

function hi(text, term) {
  let s = esc(text);
  const words = ["RAPIDA"].concat(term ? [term] : []);
  words.forEach(w => { const re = new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"); s = s.replace(re, "<mark>$1</mark>"); });
  return s;
}
function row(r, term) {
  const m = [r.outlet, fmt(r.date), r.platform, r.country].filter(Boolean).map(esc).join(" · ");
  return `<li><a class="t" href="${esc(r.url)}" target="_blank" rel="noopener">${hi(r.title, term)}</a>
    <div class="meta"><span>${m}</span><span class="lang">${esc((r.language || "?").toUpperCase())}</span></div>
    <a class="url" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(host(r.url))}</a>
    ${r.quote ? `<p class="q">${hi(r.quote, term)}</p>` : ""}</li>`;
}
function render() {
  const term = q.value.trim().toLowerCase();
  const rows = REFS.filter(r => (!fc.value || r.country === fc.value) && (!fl.value || r.language === fl.value) &&
    (!term || [r.title, r.outlet, r.quote, r.country, r.crisis_type].join(" ").toLowerCase().includes(term)));
  document.getElementById("count").textContent = rows.length === REFS.length ? `${rows.length} references` : `${rows.length} of ${REFS.length} references`;
  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = `<p class="empty">No references match. Clear the search or choose another country.</p>`; return; }
  const g = fg.value;
  if (g === "none") { list.innerHTML = `<ol class="res" style="padding-left:0">${rows.map(r => row(r, term)).join("")}</ol>`; return; }
  const groups = new Map();
  rows.forEach(r => { const k = keyOf(r, g); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  const last = k => /^(Not stated|Not detected|Undated)$/.test(k);
  const order = [...groups].sort((a, b) => (last(a[0]) - last(b[0])) || (g === "year" ? b[0].localeCompare(a[0]) : b[1].length - a[1].length || a[0].localeCompare(b[0])));
  list.innerHTML = order.map(([k, rs], i) => `<details class="grp"${i < 2 ? " open" : ""}><summary><h2>${esc(k)}</h2><span class="pill">${rs.length}</span></summary>
    <ol class="res">${rs.map(r => row(r, term)).join("")}</ol></details>`).join("");
}
[q, fc, fl, fg].forEach(el => el.addEventListener(el === q ? "input" : "change", render));
render();
